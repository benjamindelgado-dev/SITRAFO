{% extends "base.html" %}
{% block titulo %}En mantencion — SITRAFO{% endblock %}
{% block contenido %}
<div class="row justify-content-center pt-5">
  <div class="col-md-6">
    <div style="font-size:1.95rem;font-weight:700;letter-spacing:.06em">SITRAFO</div>
    <div style="font-size:.8rem;letter-spacing:.18em;color:var(--acero);margin-bottom:1.6rem">PORTAL DE CLIENTES</div>

    <div class="placa">
      <div class="placa__cabecera"><span class="placa__codigo">FUERA DE SERVICIO</span></div>
      <div class="placa__cuerpo">
        <p class="mb-0">{{ mensaje }}</p>
      </div>
    </div>

    <p class="mt-3" style="font-size:.9rem;color:var(--acero)">
      Sus cotizaciones y pedidos siguen guardados. Vuelva a intentarlo en un rato.
    </p>
  </div>
</div>
{% endblock %}
