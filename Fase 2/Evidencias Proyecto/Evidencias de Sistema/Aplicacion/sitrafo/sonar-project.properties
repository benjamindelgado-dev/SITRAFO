# Analisis estatico de SITRAFO con SonarQube
sonar.projectKey=SITRAFO
sonar.projectName=SITRAFO
sonar.sources=apps,config,escritorio,templates,static/css
sonar.tests=apps
sonar.test.inclusions=**/test_*.py,**/tests.py,**/*_tests.py
sonar.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/*_tests.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=escritorio/**,config/**
